<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relief AI Web 3.3</title><style> *{box-sizing:border-box}body{margin:0;background:#151a21;color:#e8edf4;font:15px system-ui}header{padding:18px 24px;border-bottom:1px solid #35404d;font-size:23px;font-weight:700}main{display:grid;grid-template-columns:310px 1fr;min-height:85vh}aside{padding:20px;background:#202732}label{display:block;margin:15px 0 5px}input,select,button{width:100%;padding:9px;background:#303c4a;color:white;border:1px solid #536275;border-radius:6px}button{cursor:pointer;margin-top:12px;background:#356bc1}button:disabled{opacity:.5}section{min-width:0;padding:16px}#view{height:65vh;background:#10151c;border-radius:8px}canvas.preview{width:48%;max-height:150px;object-fit:contain;background:#111}#status{font-size:13px;color:#a9c6ef;overflow-wrap:anywhere}small{color:#aeb9c7}@media(max-width:700px){main{display:block}#view{height:50vh}}.toolbar{display:flex;gap:8px;margin-bottom:10px}.toolbar button{margin:0;width:auto;flex:1}#stats{font-size:13px;color:#a9c6ef}aside{max-height:calc(100vh - 70px);overflow:auto}input[type=range]{padding:0;accent-color:#74a9ff}button:hover:not(:disabled){filter:brightness(1.15)}@media(max-width:700px){aside{max-height:none}}.toolbar{flex-wrap:wrap}.toolbar button{min-width:65px}#view{overflow:hidden}section{overflow:hidden}</style><header>Relief AI Web 3.3 <small>Фото → барельеф → STL</small></header><main><aside><label>Режим формирования рельефа</label><select id="mode"><option value="photo">Фото — объём AI</option><option value="portrait">Портрет — мягкий объём</option><option value="graphic">Рисунок / логотип — выпуклый силуэт</option><option value="raw">Исходная карта глубины</option></select><label>Подавление фона (%)</label><input id="bg" type="range" min="0" max="100" value="75"><label>Подъём объекта (%)</label><input id="lift" type="range" min="0" max="100" value="25"><label>Заполнение провалов (%)</label><input id="holes" type="range" min="0" max="100" value="65"><label>Фотография</label><input id="file" type="file" accept="image/*"><label>Ширина, мм</label><input id="width" type="number" min="1" max="2000" value="150"><label>Высота рельефа, мм</label><input id="depth" type="number" min="0.1" max="100" step="0.1" value="8"><label>Основание, мм</label><input id="base" type="number" min="0.1" max="100" step="0.1" value="2"><label>Разрешение сетки</label><select id="res"><option>128</option><option>256</option><option selected>512</option><option>768</option><option>1024</option></select><label>Сглаживание (0–5)</label><input id="smooth" type="range" min="0" max="5" value="1"><label><input id="invert" type="checkbox" style="width:auto"> Инверсия глубины (чёрное выше)</label><label>Высота детали, мм (0 = авто)</label><input id="height" type="number" min="0" max="2000" value="0"><label>Контраст глубины <output id="contrastVal">1</output></label><input id="contrast" type="range" min="0.5" max="3" step="0.05" value="1"><label>Гамма <output id="gammaVal">1</output></label><input id="gamma" type="range" min="0.3" max="3" step="0.05" value="1"><label>Отсечение фона (%)</label><input id="cut" type="range" min="0" max="90" value="0"><label>Плавный край, мм</label><input id="fade" type="number" min="0" max="100" value="3"><label>Детализация по фото (%)</label><input id="detail" type="range" min="0" max="40" value="0"><label><input id="normalize" type="checkbox" checked style="width:auto"> Нормализовать глубину</label><label>Материал предпросмотра</label><select id="material"><option value="c6a17c">Дерево</option><option value="c9c9c9">Гипс</option><option value="af884f">Бронза</option></select><button id="ai" disabled>Создать AI-барельеф</button><button id="gray" disabled>По яркости (без ИИ)</button><button id="save" disabled>Сохранить STL</button><button id="map" disabled>Сохранить карту глубины PNG</button><button id="importMap">Загрузить готовую карту глубины</button><input id="mapFile" type="file" accept="image/*" hidden><button id="reset">Сбросить настройки</button><p id="status">Загрузка 3D-редактора…</p><small>AI работает на процессоре (WASM). Работает через HTTPS. Для загрузки модели нужен интернет.</small></aside><section><div class="toolbar"><button id="front">Вид сверху</button><button id="side">Сбоку</button><button id="iso">3D</button><button id="wire">Сетка</button></div><div id="view"></div><p id="stats"></p><p><canvas class="preview" id="photo"></canvas> <canvas class="preview" id="heightmap"></canvas></p><small>Мышь: вращение, колесо: масштаб. Размеры STL — в миллиметрах.</small></section></main>
<script>window.addEventListener("error",e=>{document.getElementById("status").textContent="Ошибка запуска: "+(e.message||"не удалось загрузить модуль. Проверьте интернет и откройте сайт в Safari/Chrome.")},true);window.addEventListener("unhandledrejection",e=>{document.getElementById("status").textContent="Ошибка: "+String(e.reason)});</script><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script><script type="module">

const $=id=>document.getElementById(id), status=s=>$('status').textContent=s;let rawDepth=null;let wire=false;let sourceKind="ai";let img=null,source=null,mesh=null,estimator=null, busy=false;const scene=new T.Scene();scene.background=new T.Color(0x151b23);const camera=new T.PerspectiveCamera(40,1,.1,10000),renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));$('view').append(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);scene.add(new T.HemisphereLight(0xffffff,0x465264,2));let light=new T.DirectionalLight(0xfff0da,3);light.position.set(-100,120,180);scene.add(light);let fill=new T.DirectionalLight(0xc2d8ff,1);fill.position.set(100,-80,100);scene.add(fill);new ResizeObserver(()=>{let w=$('view').clientWidth,h=$('view').clientHeight;renderer.setSize(w,h,false);renderer.domElement.style.width="100%";renderer.domElement.style.height="100%";camera.aspect=w/h;camera.updateProjectionMatrix()}).observe($('view'));renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});camera.position.set(100,-140,220);status('Выберите фотографию.');

$('file').onchange=async()=>{if(busy)return;let f=$('file').files[0];if(!f)return;try{img=await createImageBitmap(f);source=null;rawDepth=null;if(mesh){scene.remove(mesh);mesh.geometry.dispose();mesh.material.dispose();mesh=null}let s=Math.min(1,700/Math.max(img.width,img.height));canvasImage($('photo'),img,Math.max(1,Math.round(img.width*s)),Math.max(1,Math.round(img.height*s)));$('ai').disabled=$('gray').disabled=false;$('save').disabled=$('map').disabled=true;status('Фото загружено. Выберите способ создания.')}catch(e){status('Не удалось открыть фото: '+e.message)}};
$('gray').onclick=()=>{sourceKind='gray';$('invert').checked=$('mode').value!=='graphic';source=$('photo');build(true);status('Рельеф по яркости готов (не AI).')};
$('ai').onclick=async()=>{if(busy||!img)return;busy=true;$('ai').disabled=$('gray').disabled=$('file').disabled=$('importMap').disabled=true;let stage='загрузка библиотеки';try{status('AI: загрузка библиотеки…');if(!estimator){const {pipeline,env}=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.2/dist/transformers.min.js');env.allowLocalModels=false;env.useBrowserCache=false;env.backends.onnx.wasm.numThreads=1;env.backends.onnx.wasm.proxy=false;stage='загрузка модели';let errors=[];for(const dtype of ['q8','fp32','q4']){try{status('AI: загрузка модели '+dtype+'…');estimator=await pipeline('depth-estimation','onnx-community/depth-anything-v2-small',{device:'wasm',dtype,progress_callback:p=>{if(p.status==='progress')status('AI: '+(p.file||'модель')+' '+Math.round(p.progress||0)+'%')}});break}catch(e){errors.push(dtype+': '+(e?.stack||e?.message||String(e)));console.warn(dtype,e)}}if(!estimator)throw new Error(errors.join(' | '));}stage='вычисление глубины';status('AI: вычисление глубины на процессоре…');const blob=await new Promise((resolve,reject)=>$('photo').toBlob(b=>b?resolve(b):reject(new Error('Нет изображения')),'image/png'));const url=URL.createObjectURL(blob);let r;try{r=await estimator(url)}finally{URL.revokeObjectURL(url)}stage='построение модели';let d=r.depth;if(!d||!d.data||!d.width||!d.height)throw new Error('Нейросеть не вернула карту глубины');let c=document.createElement('canvas');c.width=d.width;c.height=d.height;let ctx=c.getContext('2d'),out=ctx.createImageData(d.width,d.height);for(let i=0;i<d.width*d.height;i++){let v=d.data[i*(d.channels||1)];out.data.set([v,v,v,255],i*4)}ctx.putImageData(out,0,0);sourceKind='ai';source=c;rawDepth=null;let t=r.predicted_depth;if(t?.data&&t.dims?.length>=2){let tw=t.dims.at(-1),th=t.dims.at(-2);if(tw*th===t.data.length){rawDepth={data:Float32Array.from(t.data),w:tw,h:th}}}$('invert').checked=false;$('detail').value=0;build(true);status('AI-барельеф готов. Глубина рассчитана нейросетью, а function num(id,min,max){let v=Number($(id).value);return Number.isFinite(v)?Math.max(min,Math.min(max,v)):min}

function quantile(a,q){let b=Array.from(a).filter(Number.isFinite).sort((x,y)=>x-y);return b.length?b[Math.floor((b.length-1)*q)]:0}
function blur(a,w,h,r){let b=new Float32Array(a.length),c=new Float32Array(a.length);r=Math.max(1,Math.round(r));for(let y=0;y<h;y++){let sum=0;for(let k=-r;k<=r;k++)sum+=a[y*w+Math.max(0,Math.min(w-1,k))];for(let x=0;x<w;x++){b[y*w+x]=sum/(2*r+1);sum+=a[y*w+Math.min(w-1,x+r+1)]-a[y*w+Math.max(0,x-r)]}}for(let x=0;x<w;x++){let sum=0;for(let k=-r;k<=r;k++)sum+=b[Math.max(0,Math.min(h-1,k))*w+x];for(let y=0;y<h;y++){c[y*w+x]=sum/(2*r+1);sum+=b[Math.min(h-1,y+r+1)*w+x]-b[Math.max(0,y-r)*w+x]}}return c}

function sculpt(a,w,h){const mode=$('mode').value,cl=v=>Math.max(0,Math.min(1,v));if(mode==='raw'||sourceKind==='map')return a;let bg=+$('bg').value/100,lift=+$('lift').value/100,holes=+$('holes').value/100;
if(mode==='graphic'&&img){let c=document.createElement('canvas');canvasImage(c,img,w,h);let p=c.getContext('2d').getImageData(0,0,w,h).data;let channels=[0,1,2].map(k=>Float32Array.from({length:w*h},(_,i)=>p[4*i+k]/255));let base=channels.map(v=>quantile(border(v,w,h),.5));let dist=Float32Array.from(a,(_,i)=>p[4*i+3]<128?0:Math.hypot(...channels.map((v,k)=>v[i]-base[k]))/Math.sqrt(3));let hi=Math.max(.01,quantile(dist,.98));let mask=Float32Array.from(dist,v=>cl((v/hi-.08)/.65));let soft=blur(mask,w,h,Math.max(1,Math.min(w,h)*.035));return Float32Array.from(mask,(v,i)=>cl(v*(.3+.7*Math.sqrt(soft[i]))));}
if(sourceKind!=='ai')return a;let lo=quantile(a,.02),hi=quantile(a,.98);if(hi-lo<1e-7)return a;let z=Float32Array.from(a,v=>cl((v-lo)/(hi-lo)));let edge=quantile(border(z,w,h),.5);let mid=quantile(z,.5);let threshold=Math.min(.85,Math.max(0,edge+.04));let mask=Float32Array.from(z,v=>cl((v-threshold)/Math.max(.12,1-threshold)));let radius=Math.max(1,Math.round(Math.min(w,h)*(mode==='portrait'?.018:.009)));let soft=blur(z,w,h,radius),m=blur(mask,w,h,radius);return Float32Array.from(z,(v,i)=>{let fixed=v+holes*Math.max(0,soft[i]-v);if(mode==='portrait')fixed=.65*fixed+.35*soft[i];let raised=cl(fixed*(1-lift)+lift*Math.sqrt(m[i]));return cl(raised*((1-bg)+bg*Math.sqrt(m[i])))});}

function build(reset=false){if(!source)return;let W=num('width',1,2000),D=num('depth',.1,100),B=num('base',.1,100),H=num('height',0,2000)||W*source.height/source.width,n=+ $('res').value, nx=Math.max(2,Math.round(n*Math.min(1,W/H))),ny=Math.max(2,Math.round(n*Math.min(1,H/W)));let c=$('heightmap');canvasImage(c,source,nx,ny);let ctx=c.getContext('2d'),p=ctx.getImageData(0,0,nx,ny),a=new Float32Array(nx*ny);for(let i=0;i<a.length;i++){let k=i*4;a[i]=(p.data[k]*.299+p.data[k+1]*.587+p.data[k+2]*.114)/255;}if(sourceKind==='ai'&&rawDepth){let {data,w,h}=rawDepth;let lo=quantile(data,.01),hi=quantile(data,.99);if(hi>lo){for(let y=0;y<ny;y++)for(let x=0;x<nx;x++){let fx=x*(w-1)/(nx-1),fy=y*(h-1)/(ny-1),ix=Math.floor(fx),iy=Math.floor(fy),jx=Math.min(w-1,ix+1),jy=Math.min(h-1,iy+1),u=fx-ix,v=fy-iy;let d=(1-v)*((1-u)*data[iy*w+ix]+u*data[iy*w+jx])+v*((1-u)*data[jy*w+ix]+u*data[jy*w+jx]);a[y*nx+x]=Math.max(0,Math.min(1,(d-lo)/(hi-lo)))}}}if($('invert').checked)for(let i=0;i<a.length;i++)a[i]=1-a[i];a=sculpt(a,nx,ny);for(let j=0;j<+$('smooth').value;j++){let b=a.slice();for(let y=1;y<ny-1;y++)for(let x=1;x<nx-1;x++){let i=y*nx+x;b[i]=(a[i]*4+a[i-1]+a[i+1]+a[i-nx]+a[i+nx])/8}a=b}let lo=1,hi=0;for(let v of a){lo=Math.min(lo,v);hi=Math.max(hi,v)}let con=num('contrast',.5,3),gam=num('gamma',.3,3),cut=num('cut',0,90)/100,fade=num('fade',0,100),detail=num('detail',0,40)/100;let clamp=v=>Math.min(1,Math.max(0,v));let ph=document.createElement('canvas');let pix=null;if(img&&detail){canvasImage(ph,img,nx,ny);pix=ph.getContext('2d').getImageData(0,0,nx,ny).data}let lum=i=> (pix[i*4]*.299+pix[i*4+1]*.587+pix[i*4+2]*.114)/255;for(let y=0;y<ny;y++)for(let x=0;x<nx;x++){let i=y*nx+x,v=a[i];if($('normalize').checked&&hi-lo>1e-6)v=(v-lo)/(hi-lo);v=Math.pow(clamp((v-.5)*con+.5),gam);v=clamp((v-cut)/(1-cut));if(pix&&sourceKind==='ai'&&x>0&&y>0&&x<nx-1&&y<ny-1)v=clamp(v+detail*(lum(i)-(lum(i-1)+lum(i+1)+lum(i-nx)+lum(i+nx))/4));if(fade){let t=clamp(Math.min(x*W/(nx-1),(nx-1-x)*W/(nx-1),y*H/(ny- for(let id of ['width','height','depth','base','res','smooth','invert','contrast','gamma','cut','fade','detail','normalize','mode','bg','lift','holes'])$(id).onchange=()=>build(id==='width'||id==='height');function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}$('save').onclick=()=>{if(mesh){let data=new STLExporter().parse(mesh,{binary:true});download(new Blob([data],{type:'application/octet-stream'}),'relief.stl')}};$('map').onclick=()=>$('heightmap').toBlob(b=>download(b,'depth.png'));

for(let id of ['contrast','gamma'])$(id).oninput=()=>$(id+'Val').value=$(id).value;

for(let id of ['front','side','iso'])$(id).onclick=()=>view(id);
