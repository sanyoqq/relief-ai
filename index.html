<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relief AI Web 3.1</title><style> *{box-sizing:border-box}body{margin:0;background:#151a21;color:#e8edf4;font:15px system-ui}header{padding:18px 24px;border-bottom:1px solid #35404d;font-size:23px;font-weight:700}main{display:grid;grid-template-columns:310px 1fr;min-height:85vh}aside{padding:20px;background:#202732}label{display:block;margin:15px 0 5px}input,select,button{width:100%;padding:9px;background:#303c4a;color:white;border:1px solid #536275;border-radius:6px}button{cursor:pointer;margin-top:12px;background:#356bc1}button:disabled{opacity:.5}section{min-width:0;padding:16px}#view{height:65vh;background:#10151c;border-radius:8px}canvas.preview{width:48%;max-height:150px;object-fit:contain;background:#111}#status{font-size:13px;color:#a9c6ef;overflow-wrap:anywhere}small{color:#aeb9c7}@media(max-width:700px){main{display:block}#view{height:50vh}}.toolbar{display:flex;gap:8px;margin-bottom:10px}.toolbar button{margin:0;width:auto;flex:1}#stats{font-size:13px;color:#a9c6ef}aside{max-height:calc(100vh - 70px);overflow:auto}input[type=range]{padding:0;accent-color:#74a9ff}button:hover:not(:disabled){filter:brightness(1.15)}@media(max-width:700px){aside{max-height:none}}</style><header>Relief AI Web 3.1 <small>Фото → барельеф → STL</small></header><main><aside><label>Фотография</label><input id="file" type="file" accept="image/*"><label>Ширина, мм</label><input id="width" type="number" min="1" max="2000" value="150"><label>Высота рельефа, мм</label><input id="depth" type="number" min="0.1" max="100" step="0.1" value="8"><label>Основание, мм</label><input id="base" type="number" min="0.1" max="100" step="0.1" value="2"><label>Разрешение сетки</label><select id="res"><option>128</option><option selected>256</option><option>512</option><option>768</option><option>1024</option></select><label>Сглаживание (0–5)</label><input id="smooth" type="range" min="0" max="5" value="1"><label><input id="invert" type="checkbox" style="width:auto"> Инверсия глубины (чёрное выше)</label><label>Высота детали, мм (0 = авто)</label><input id="height" type="number" min="0" max="2000" value="0"><label>Контраст глубины <output id="contrastVal">1</output></label><input id="contrast" type="range" min="0.5" max="3" step="0.05" value="1"><label>Гамма <output id="gammaVal">1</output></label><input id="gamma" type="range" min="0.3" max="3" step="0.05" value="1"><label>Отсечение фона (%)</label><input id="cut" type="range" min="0" max="90" value="0"><label>Плавный край, мм</label><input id="fade" type="number" min="0" max="100" value="3"><label>Детализация по фото (%)</label><input id="detail" type="range" min="0" max="40" value="0"><label><input id="normalize" type="checkbox" checked style="width:auto"> Нормализовать глубину</label><label>Материал предпросмотра</label><select id="material"><option value="c6a17c">Дерево</option><option value="c9c9c9">Гипс</option><option value="af884f">Бронза</option></select><button id="ai" disabled>Создать AI-барельеф</button><button id="gray" disabled>По яркости (без ИИ)</button><button id="save" disabled>Сохранить STL</button><button id="map" disabled>Сохранить карту глубины PNG</button><button id="importMap">Загрузить готовую карту глубины</button><input id="mapFile" type="file" accept="image/*" hidden><button id="reset">Сбросить настройки</button><p id="status">Загрузка 3D-редактора…</p><small>AI работает на процессоре (WASM). Рекомендуется Chrome через localhost. Для загрузки модели нужен интернет.</small></aside><section><div class="toolbar"><button id="front">Вид сверху</button><button id="side">Сбоку</button><button id="iso">3D</button><button id="wire">Сетка</button></div><div id="view"></div><p id="stats"></p><p><canvas class="preview" id="photo"></canvas> <canvas class="preview" id="heightmap"></canvas></p><small>Мышь: вращение, колесо: масштаб. Размеры STL — в миллиметрах.</small></section></main>
<script>window.addEventListener("error",e=>{document.getElementById("status").textContent="Ошибка запуска: "+(e.message||"не удалось загрузить модуль. Проверьте интернет и откройте сайт в Safari/Chrome.")},true);window.addEventListener("unhandledrejection",e=>{document.getElementById("status").textContent="Ошибка: "+String(e.reason)});</script><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script><script type="module">
import * as T from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {STLExporter} from 'three/addons/exporters/STLExporter.js';
const $=id=>document.getElementById(id), status=s=>$('status').textContent=s;let wire=false;let sourceKind="ai";let img=null,source=null,mesh=null,estimator=null, busy=false;const scene=new T.Scene();scene.background=new T.Color(0x151b23);const camera=new T.PerspectiveCamera(40,1,.1,10000),renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));$('view').append(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);scene.add(new T.HemisphereLight(0xffffff,0x465264,2));let light=new T.DirectionalLight(0xfff0da,3);light.position.set(-100,120,180);scene.add(light);let fill=new T.DirectionalLight(0xc2d8ff,1);fill.position.set(100,-80,100);scene.add(fill);new ResizeObserver(()=>{let w=$('view').clientWidth,h=$('view').clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}).observe($('view'));renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});camera.position.set(100,-140,220);status('Выберите фотографию.');
function canvasImage(c,im,w,h){c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h)}
$('file').onchange=async()=>{if(busy)return;let f=$('file').files[0];if(!f)return;try{img=await createImageBitmap(f);source=null;if(mesh){scene.remove(mesh);mesh.geometry.dispose();mesh.material.dispose();mesh=null}let s=Math.min(1,700/Math.max(img.width,img.height));canvasImage($('photo'),img,Math.max(1,Math.round(img.width*s)),Math.max(1,Math.round(img.height*s)));$('ai').disabled=$('gray').disabled=false;$('save').disabled=$('map').disabled=true;status('Фото загружено. Выберите способ создания.')}catch(e){status('Не удалось открыть фото: '+e.message)}};
$('gray').onclick=()=>{sourceKind='gray';$('invert').checked=true;source=$('photo');build(true);status('Рельеф по яркости готов (не AI).')};
$('ai').onclick=async()=>{if(busy||!img)return;busy=true;$('ai').disabled=$('gray').disabled=$('file').disabled=$('importMap').disabled=true;let stage='загрузка библиотеки';try{status('AI: загрузка библиотеки…');if(!estimator){const {pipeline,env}=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.2/dist/transformers.min.js');env.allowLocalModels=false;env.useBrowserCache=true;env.backends.onnx.wasm.numThreads=1;env.backends.onnx.wasm.proxy=false;stage='загрузка модели';let last;for(const dtype of ['q8','fp32']){try{status('AI: загрузка модели '+dtype+'…');estimator=await pipeline('depth-estimation','onnx-community/depth-anything-v2-small-ONNX',{device:'wasm',dtype,progress_callback:p=>{if(p.status==='progress')status('AI: '+(p.file||'модель')+' '+Math.round(p.progress||0)+'%')}});break}catch(e){last=e;console.warn(dtype,e)}}if(!estimator)throw last;}stage='вычисление глубины';status('AI: вычисление глубины на процессоре…');const blob=await new Promise((resolve,reject)=>$('photo').toBlob(b=>b?resolve(b):reject(new Error('Нет изображения')),'image/png'));const url=URL.createObjectURL(blob);let r;try{r=await estimator(url)}finally{URL.revokeObjectURL(url)}stage='построение модели';let d=r.depth;if(!d||!d.data||!d.width||!d.height)throw new Error('Нейросеть не вернула карту глубины');let c=document.createElement('canvas');c.width=d.width;c.height=d.height;let ctx=c.getContext('2d'),out=ctx.createImageData(d.width,d.height);for(let i=0;i<d.width*d.height;i++){let v=d.data[i*(d.channels||1)];out.data.set([v,v,v,255],i*4)}ctx.putImageData(out,0,0);sourceKind='ai';source=c;$('invert').checked=false;$('detail').value=0;build(true);status('AI-барельеф готов. Глубина рассчитана нейросетью, а не яркостью фото.')}catch(e){console.error(e);status('Ошибка AI ('+stage+'): '+(e?.message||String(e))+' | Откройте через localhost в Chrome и проверьте интернет.')}finally{busy=false;$('ai').disabled=$('gray').disabled=$('file').disabled=$('importMap').disabled=false}};
function num(id,min,max){let v=Number($(id).value);return Number.isFinite(v)?Math.max(min,Math.min(max,v)):min}
function build(reset=false){if(!source)return;let W=num('width',1,2000),D=num('depth',.1,100),B=num('base',.1,100),H=num('height',0,2000)||W*source.height/source.width,n=+ $('res').value, nx=Math.max(2,Math.round(n*Math.min(1,W/H))),ny=Math.max(2,Math.round(n*Math.min(1,H/W)));let c=$('heightmap');canvasImage(c,source,nx,ny);let ctx=c.getContext('2d'),p=ctx.getImageData(0,0,nx,ny),a=new Float32Array(nx*ny);for(let i=0;i<a.length;i++){let k=i*4;a[i]=(p.data[k]*.299+p.data[k+1]*.587+p.data[k+2]*.114)/255;if($('invert').checked)a[i]=1-a[i]}for(let j=0;j<+$('smooth').value;j++){let b=a.slice();for(let y=1;y<ny-1;y++)for(let x=1;x<nx-1;x++){let i=y*nx+x;b[i]=(a[i]*4+a[i-1]+a[i+1]+a[i-nx]+a[i+nx])/8}a=b}let lo=1,hi=0;for(let v of a){lo=Math.min(lo,v);hi=Math.max(hi,v)}let con=num('contrast',.5,3),gam=num('gamma',.3,3),cut=num('cut',0,90)/100,fade=num('fade',0,100),detail=num('detail',0,40)/100;let clamp=v=>Math.min(1,Math.max(0,v));let ph=document.createElement('canvas');let pix=null;if(img&&detail){canvasImage(ph,img,nx,ny);pix=ph.getContext('2d').getImageData(0,0,nx,ny).data}let lum=i=> (pix[i*4]*.299+pix[i*4+1]*.587+pix[i*4+2]*.114)/255;for(let y=0;y<ny;y++)for(let x=0;x<nx;x++){let i=y*nx+x,v=a[i];if($('normalize').checked&&hi-lo>1e-6)v=(v-lo)/(hi-lo);v=Math.pow(clamp((v-.5)*con+.5),gam);v=clamp((v-cut)/(1-cut));if(pix&&sourceKind==='ai'&&x>0&&y>0&&x<nx-1&&y<ny-1)v=clamp(v+detail*(lum(i)-(lum(i-1)+lum(i+1)+lum(i-nx)+lum(i+nx))/4));if(fade){let t=clamp(Math.min(x*W/(nx-1),(nx-1-x)*W/(nx-1),y*H/(ny-1),(ny-1-y)*H/(ny-1))/fade);v*=t*t*(3-2*t)}a[i]=v}for(let i=0;i<a.length;i++){let v=Math.round(a[i]*255);p.data.set([v,v,v,255],i*4)}ctx.putImageData(p,0,0);let N=nx*ny,verts=new Float32Array(6*N),vi=0,idx=new Uint32Array(12*(nx-1)*(ny-1)+6*(2*nx+2*ny-4)),ii=0;for(let layer=0;layer<2;layer++)for(let y=0;y<ny;y++)for(let x=0;x<nx;x++){verts[vi++]=W*(x/(nx-1)-.5);verts[vi++]=H*(.5-y/(ny-1));verts[vi++]=layer?0:B+D*a[y*nx+x]}for(let y=0;y<ny-1;y++)for(let x=0;x<nx-1;x++){let i=y*nx+x,j=i+1,k=i+nx,l=k+1;{idx.set([i,k,j,j,k,l,i+N,j+N,k+N,j+N,l+N,k+N],ii);ii+=12}}let edge=[];for(let x=0;x<nx;x++)edge.push(x);for(let y=1;y<ny;y++)edge.push(y*nx+nx-1);for(let x=nx-2;x>=0;x--)edge.push((ny-1)*nx+x);for(let y=ny-2;y>0;y--)edge.push(y*nx);for(let j=0;j<edge.length;j++){let i=edge[j],k=edge[(j+1)%edge.length];{idx.set([i,k,k+N,i,k+N,i+N],ii);ii+=6}}let g=new T.BufferGeometry();g.setAttribute('position',new T.BufferAttribute(verts,3));g.setIndex(new T.BufferAttribute(idx,1));g.computeVertexNormals();if(mesh){scene.remove(mesh);mesh.geometry.dispose();mesh.material.dispose()}mesh=new T.Mesh(g,new T.MeshStandardMaterial({color:parseInt($('material').value,16),roughness:.85,wireframe:wire}));scene.add(mesh);if(reset){let m=Math.max(W,H);camera.position.set(m*.65,-m*.85,m*1.65);controls.target.set(0,0,B+D/2);controls.update()}$('save').disabled=$('map').disabled=false;$('stats').textContent=`${W.toFixed(1)} × ${H.toFixed(1)} × ${(B+D).toFixed(1)} мм (макс.) | ${nx} × ${ny} | ${Math.round(idx.length/3).toLocaleString('ru-RU')} треугольников | STL ≈ ${(idx.length/3*50/1048576).toFixed(1)} МБ`;}
for(let id of ['width','height','depth','base','res','smooth','invert','contrast','gamma','cut','fade','detail','normalize'])$(id).onchange=()=>build(id==='width'||id==='height');function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}$('save').onclick=()=>{if(mesh){let data=new STLExporter().parse(mesh,{binary:true});download(new Blob([data],{type:'application/octet-stream'}),'relief.stl')}};$('map').onclick=()=>$('heightmap').toBlob(b=>download(b,'depth.png'));

for(let id of ['contrast','gamma'])$(id).oninput=()=>$(id+'Val').value=$(id).value;
$('material').onchange=()=>{if(mesh)mesh.material.color.setHex(parseInt($('material').value,16))};$('wire').onclick=()=>{wire=!wire;if(mesh)mesh.material.wireframe=wire};
function view(mode){if(!mesh)return;let b=new T.Box3().setFromObject(mesh),v=b.getSize(new T.Vector3()),m=Math.max(v.x,v.y,v.z),z=v.z/2;controls.target.set(0,0,z);camera.position.set(...(mode==='front'?[0,0,m*2.1+z]:mode==='side'?[0,-m*2.1,z]:[m*.65,-m*.85,m*1.65]));controls.update()}
for(let id of ['front','side','iso'])$(id).onclick=()=>view(id);
$('importMap').onclick=()=>$('mapFile').click();$('mapFile').onchange=async()=>{if(busy)return;try{let f=$('mapFile').files[0];if(!f)return;let im=await createImageBitmap(f),c=document.createElement('canvas');canvasImage(c,im,im.width,im.height);sourceKind="map";source=c;if(!img){img=im;canvasImage($('photo'),im,im.width,im.height)}build(true);status('Карта глубины загружена.')}catch(e){status(e.message)}};
$('reset').onclick=()=>{for(let [id,v] of Object.entries({width:150,height:0,depth:8,base:2,res:256,smooth:1,contrast:1,gamma:1,cut:0,fade:3,detail:0,material:'c6a17c'}))$(id).value=v;$('invert').checked=sourceKind==='gray';$('normalize').checked=true;$('contrastVal').value=$('gammaVal').value=1;build(true)};
</script></html>
