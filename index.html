function build(reset=false){if(!source)return;let W=num('width',1,2000),D=num('depth',.1,100),B=num('base',.1,100),H=num('height',0,2000)||W*source.height/source.width,n=+$('res').value,nx=Math.max(2,Math.round(n*Math.min(1,W/H))),ny=Math.max(2,Math.round(n*Math.min(1,H/W)));let c=$('heightmap');c.width=nx;c.height=ny;canvasImage(c,source,nx,ny);let ctx=c.getContext('2d'),p=ctx.getImageData(0,0,nx,ny),a=new Float32Array(nx*ny);for(let i=0;i<a.length;i++){let k=i*4;a[i]=(p.data[k]*.299+p.data[k+1]*.587+p.data[k+2]*.114)/255}if(sourceKind==='ai'&&rawDepth){let {data,w,h}=rawDepth;let lo=quantile(data,.01),hi=quantile(data,.99);if(hi>lo){for(let y=0;y<ny;y++)for(let x=0;x<nx;x++){let fx=x*(w-1)/(nx-1),fy=y*(h-1)/(ny-1),ix=Math.floor(fx),iy=Math.floor(fy),jx=Math.min(w-1,ix+1),jy=Math.min(h-1,iy+1),u=fx-ix,v=fy-iy;let d=(1-v)*((1-u)*data[iy*w+ix]+u*data[iy*w+jx])+v*((1-u)*data[jy*w+ix]+u*data[jy*w+jx]);a[y*nx+x]=clamp((d-lo)/(hi-lo))}}}

$('file').onchange=async()=>{if(busy)return;let f=$('file').files[0];if(!f)return;try{img=await createImageBitmap(f);source=null;rawDepth=null;if(mesh){scene.remove(mesh);mesh.geometry.dispose();mesh.material.dispose();mesh=null}let s=Math.min(1,700/Math.max(img.width,img.height));canvasImage($('photo'),img,Math.max(1,Math.round(img.width*s)),Math.max(1,Math.round(img.height*s)));$('ai').disabled=$('gray').disabled=false;$('save').disabled=$('map').disabled=true;status('Фото загружено.')}catch(e){status('Не удалось открыть фото: '+e.message)}};
$('gray').onclick=()=>{sourceKind='gray';source=$('photo');build(true);status('Готово: рельеф по яркости.')};
$('ai').onclick=async()=>{if(busy||!img)return;busy=true;$('ai').disabled=$('gray').disabled=$('file').disabled=$('importMap').disabled=true;let stage='загрузка библиотеки';try{status('AI: загрузка библиотеки…');if(!estimator){const {pipeline,env}=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.2/dist/transformers.min.js');env.allowLocalModels=false;env.useBrowserCache=false;env.backends.onnx.wasm.numThreads=1;env.backends.onnx.wasm.proxy=false;stage='загрузка модели';let errors=[];for(const dtype of ['q8','fp32','q4']){try{status('AI: загрузка модели '+dtype+'…');estimator=await pipeline('depth-estimation','onnx-community/depth-anything-v2-small',{device:'wasm',dtype,progress_callback:p=>{if(p.status==='progress')status('AI: '+(p.file||'модель')+' '+Math.round(p.progress||0)+'%')}});break}catch(e){errors.push(dtype+': '+(e?.message||String(e)));console.warn(dtype,e)}}if(!estimator)throw new Error(errors.join(' | '));}
stage='вычисление глубины';status('AI: вычисление глубины…');const blob=await new Promise((resolve,reject)=>$('photo').toBlob(b=>b?resolve(b):reject(new Error('Нет изображения')),'image/png'));const url=URL.createObjectURL(blob);let r;try{r=await estimator(url)}finally{URL.revokeObjectURL(url)}stage='построение рельефа';let d=r.depth;if(!d||!d.data||!d.width||!d.height)throw new Error('Нет карты глубины');let c=document.createElement('canvas');c.width=d.width;c.height=d.height;let ctx=c.getContext('2d'),out=ctx.createImageData(d.width,d.height);for(let i=0;i<d.width*d.height;i++){let v=d.data[i*(d.channels||1)];out.data.set([v,v,v,255],i*4)}ctx.putImageData(out,0,0);sourceKind='ai';source=c;rawDepth=null;let t=r.predicted_depth;if(t?.data&&t.dims?.length>=2){let tw=t.dims.at(-1),th=t.dims.at(-2);if(tw*th===t.data.length)rawDepth={data:Float32Array.from(t.data),w:tw,h:th}}build(true);status('AI-барельеф готов.')}catch(e){console.error(e);status('Ошибка AI ('+stage+'): '+(e?.message||String(e)))}finally{busy=false;$('ai').disabled=$('gray').disabled=$('file').disabled=$('importMap').disabled=false}};
$('importMap').onclick=()=>$('mapFile').click();$('mapFile').onchange=async()=>{if(busy)return;try{let f=$('mapFile').files[0];if(!f)return;let im=await createImageBitmap(f),c=document.createElement('canvas');canvasImage(c,im,im.width,im.height);sourceKind='map';rawDepth=null;source=c;if(!img){img=im;canvasImage($('photo'),im,im.width,im.height)}build(true);status('Карта глубины загружена.')}catch(e){status(e.message)}};
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$('save').onclick=()=>{if(mesh&&exportField){const {a,W,H,B,D,nx,ny}=exportField;const g=geometryFor(a,W,H,B,D,nx,ny);try{let data=new STLExporter().parse(new T.Mesh(g,mesh.material),{binary:true});download(new Blob([data],{type:'application/octet-stream'}),'relief.stl')}finally{g.dispose()}}};$('map').onclick=()=>$('heightmap').toBlob(b=>download(b,'depth.png'));
for(let id of ['contrast','gamma'])$(id).oninput=()=>$(id+'Val').value=$(id).value;
for(let id of ['width','height','depth','base','res','smooth','invert','contrast','gamma','cut','fade','normalize','mode','bg','lift','holes','detailBoost','flatBg','skin'])$(id).onchange=()=>build(id==='width'||id==='height');
$('material').onchange=()=>{if(mesh)mesh.material.color.setHex(parseInt($('material').value,16))};$('wire').onclick=()=>{wire=!wire;if(mesh)mesh.material.wireframe=wire};
function view(mode){if(!mesh)return;let b=new T.Box3().setFromObject(mesh),v=b.getSize(new T.Vector3()),m=Math.max(v.x,v.y,v.z),z=v.z/2;controls.target.set(0,0,z);camera.position.set(...(mode==='front'?[0,-m*.0001,m*2.1+z]:mode==='side'?[0,-m*2.1,z]:[m*.65,-m*.85,m*1.65]));controls.update()}for(let id of ['front','side','iso'])$(id).onclick=()=>view(id);
for(const id of ['bg','lift','detailBoost','holes','flatBg'])$(id).oninput=()=>$(id+'Val').value=$(id).value+'%';
$('reset').onclick=()=>{for(let [id,v] of Object.entries({mode:'photo',bg:100,lift:100,detailBoost:100,holes:100,flatBg:80,skin:35,width:150,depth:14,base:3,res:768,smooth:1,height:0,contrast:1.12,gamma:0.92,cut:0,fade:2,material:'c6a17c'}))$(id).value=v;$('invert').checked=false;$('normalize').checked=true;$('contrastVal').value=$('contrast').value;$('gammaVal').value=$('gamma').value;for(const id of ['bg','lift','detailBoost','holes','flatBg'])$(id+'Val').value=$(id).value+'%';build(true)};
